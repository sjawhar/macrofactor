name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build SvelteKit
        run: npm run build
      - name: Build MCP server
        run: npm run build:mcp

  release:
    name: Release
    needs: [check, test, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Semantic Release
        run: npx semantic-release@24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@sjawhar/macrofactor-mcp@${VERSION}" version 2>/dev/null; then
            echo "v${VERSION} already published, skipping"
          else
            echo "Publishing v${VERSION}"
            echo "::group::npm trusted publishing diagnostics"
            node --version
            npm --version
            if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
              echo "ACTIONS_ID_TOKEN_REQUEST_URL is present"
            else
              echo "ACTIONS_ID_TOKEN_REQUEST_URL is missing"
            fi
            if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN is present"
            else
              echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN is missing"
            fi
            NPM_CONFIG_JSON="$(npm config list --json)" node --input-type=module <<'NODE'
            const config = JSON.parse(process.env.NPM_CONFIG_JSON);
            for (const key of Object.keys(config)) {
              if (/auth|token|password|otp/i.test(key)) config[key] = '<redacted>';
            }
            console.log(JSON.stringify(config, null, 2));
          NODE
            if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              node --input-type=module <<'NODE'
              const requestUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
              requestUrl.searchParams.set('audience', 'npm:registry.npmjs.org');

              const response = await fetch(requestUrl, {
                headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
              });

              console.log(`OIDC request status: ${response.status}`);
              const body = await response.json().catch(() => null);
              if (!response.ok) {
                console.log(`OIDC error keys: ${body ? Object.keys(body).join(',') : 'non-json'}`);
                process.exit(1);
              }

              const token = body?.value;
              const jwtParts = typeof token === 'string' ? token.split('.') : [];
              console.log(`OIDC token received: ${jwtParts.length === 3 ? 'yes (jwt shaped)' : 'no'}`);
              if (jwtParts.length === 3) {
                const payload = JSON.parse(Buffer.from(jwtParts[1], 'base64url').toString('utf8'));
                console.log(`OIDC aud: ${JSON.stringify(payload.aud)}`);
                console.log(`OIDC sub: ${payload.sub}`);
                console.log(`OIDC repository: ${payload.repository}`);
                console.log(`OIDC ref: ${payload.ref}`);
                console.log(`OIDC workflow_ref: ${payload.workflow_ref}`);
                console.log(`OIDC job_workflow_ref: ${payload.job_workflow_ref}`);
                console.log(`OIDC workflow: ${payload.workflow}`);
                console.log(`OIDC environment: ${payload.environment ?? '<none>'}`);
              }
          NODE
            fi
            echo "::endgroup::"
            npm run build:mcp
            npm publish --access public --provenance --loglevel verbose
          fi
